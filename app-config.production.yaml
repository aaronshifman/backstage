app:
  baseUrl: https://${BACKSTAGE_HOSTNAME}

backend:
  baseUrl: https://${BACKSTAGE_HOSTNAME}
  listen: ':7007'
  cors:
    origin: https://${BACKSTAGE_HOSTNAME}
  database:
    client: pg
    pluginDivisionMode: schema
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      database: app

integrations:
  github:
    - host: github.com
      token: ${GITHUB_TOKEN}

auth:
  environment: production
  session:
    secret: ${AUTH_SESSION_SECRET}
  providers:
    oidc:
      production:
        metadataUrl: https://keycloak.shifman.dev/realms/master/.well-known/openid-configuration
        clientId: backstage
        clientSecret: ${BACKSTAGE_KEY}
        signIn:
          resolvers:
            - resolver: emailMatchingUserEntityProfileEmail

kubernetes:
  clusterLocatorMethods:
    - type: config
      clusters:
        - url: https://kubernetes.default.svc
          name: shifman
          authProvider: serviceAccount
          serviceAccountToken:
            $file: /var/run/secrets/kubernetes.io/serviceaccount/token
          caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt

kubescape:
  clusterUrl: https://kubernetes.default.svc
  caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
  token:
    $file: /var/run/secrets/kubernetes.io/serviceaccount/token

catalog:
  providers:
    github:
      providerId:
        organization: 'aaronshifman'
        catalogPath: '**/catalog-info.yaml'
        filters:
          branch: 'main'
          repository: '.*'
        schedule:
          frequency: { minutes: 30 }
          timeout: { minutes: 3 }
    k8SCnpgProvider:
      clusterUrl: https://kubernetes.default.svc
      caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      token:
        $file: /var/run/secrets/kubernetes.io/serviceaccount/token
  locations: []
