name: Release Helm Chart

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      CHART_NAME: backstage
      IMAGE_NAME: ghcr.io/${{ github.repository }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5
        with:
          version: v3.18.3

      - name: Extract version
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          echo "SHORT_SHA=$(git rev-parse --short=7 HEAD)" >> $GITHUB_ENV

      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Verify image exists
        run: |
          docker buildx imagetools inspect \
            ${IMAGE_NAME}:sha-${SHORT_SHA}

      - name: Retag image as release
        run: |
          docker buildx imagetools create \
            --tag ${IMAGE_NAME}:v${VERSION} \
            ${IMAGE_NAME}:sha-${SHORT_SHA}

      - name: Package Chart
        run: |
          helm package charts/${CHART_NAME} \
            --version ${VERSION} \
            --app-version ${VERSION}

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Generate Chart SBOM
        run: |
          syft \
            packages dir:charts/${CHART_NAME} \
            -o spdx-json \
            > chart-sbom.spdx.json

      - name: Login Helm OCI
        run: |
          echo "${{ github.token }}" \
            | helm registry login ghcr.io \
                -u ${{ github.actor }} \
                --password-stdin

      - name: Push Chart
        run: |
          OUTPUT=$(helm push \
            ${CHART_NAME}-${VERSION}.tgz \
            oci://ghcr.io/${{ github.repository_owner }}/charts 2>&1)
          echo "$OUTPUT"
          CHART_DIGEST=$(echo "$OUTPUT" | grep '^Digest:' | awk '{print $2}')
          echo "CHART_DIGEST=${CHART_DIGEST}" >> $GITHUB_ENV

      - name: Attest Chart Provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/charts/${{ env.CHART_NAME }}
          subject-digest: ${{ env.CHART_DIGEST }}
          push-to-registry: true

      - uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

      - name: Sign Chart
        run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/charts/${CHART_NAME}@${CHART_DIGEST}

      - name: Attest Chart SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/charts/${{ env.CHART_NAME }}
          subject-digest: ${{ env.CHART_DIGEST }}
          sbom-path: chart-sbom.spdx.json
          push-to-registry: true
