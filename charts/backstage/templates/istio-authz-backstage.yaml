kind: AuthorizationPolicy
apiVersion: security.istio.io/v1
metadata:
  name: {{.Release.Name}}
  labels:
    {{- include "backstage.labels" . | nindent 4 }}
    app.kubernetes.io/component: networking
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: {{ .Release.Name }}
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/istio-system/sa/istio-ingress-istio
    {{- with .Values.istio.smokeTestPrincipals }}
    - from:
        - source:
            principals:
              {{- toYaml . | nindent 14 }}
      to:
        - operation:
            methods: ["GET"]
            paths: ["/", "/.backstage/health/*"]
    {{- end }}
