apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{.Release.Name}}-route
  labels:
    {{- include "backstage.labels" . | nindent 4 }}
    app.kubernetes.io/component: networking
spec:
  parentRefs:
    - name: istio-ingress
      namespace: istio-system
  hostnames:
    - {{ .Values.ingress.hostname }}
  rules:
    - backendRefs:
        - name: {{.Release.Name}}
          port: 7007
