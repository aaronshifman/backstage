apiVersion: v1
kind: Service
metadata:
  name: {{.Release.Name}}
  labels:
    {{- include "backstage.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - port: 7007
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "backstage.selectorLabels" . | nindent 4 }}
